services:
  portal:
    image: node:22-alpine
    working_dir: /app
    command: node server.js
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ..:/app
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - portal
    environment:
      PORTAL_HOST: ${PORTAL_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"

  freeradius:
    image: freeradius/freeradius-server:latest
    restart: unless-stopped
    command: ["freeradius", "-f", "-X"]
    volumes:
      - ./freeradius/clients.conf:/etc/freeradius/clients.conf:ro
      - ./freeradius/authorize:/etc/freeradius/mods-config/files/authorize:ro
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"

volumes:
  caddy_data:
  caddy_config:
